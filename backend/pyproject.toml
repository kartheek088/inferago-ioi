[project]
name = "inferago-ioi"
version = "0.1.0"
description = "Inferago Opportunity Intelligence — internal opportunity discovery and qualification tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "anthropic>=2.11.0",
    "osmium>=4.3.2",
    "duckdb>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "fpdf2>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
